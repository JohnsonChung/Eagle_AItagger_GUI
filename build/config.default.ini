; Eagle AI Tagger — 發佈版預設設定
; 打包時會複製為 dist/EagleTagger/config.ini
; 所有路徑皆為相對於 EagleTagger.exe 所在目錄

[Version]
version = 4.0.1

[Model]
; 推薦: https://huggingface.co/SmilingWolf/wd-eva02-large-tagger-v3
; 下載 model.onnx 直接放入 model/ 資料夾即可
model_path = model\model.onnx
; Tags-cn 字典含中文欄位 (right_tag_cn)，與 wd-eva02-large-tagger-v3 的 10861 個標籤對應
tags_path = csv\Tags-cn_2024_ver-1.0.csv

[Tag]
threshold = 0.35
replace_underscore = True
underscore_excludes = 
escape_tags = False
use_chinese_name = False
additional_tags = AITagger_ed
exclude_tags = 
sort_alphabetically = False

[Json]
is_creat_image_info_csv = False
add_write_mode = False

[Process]
max_workers = 3
batch_size = 8
max_retries = 3
checkpoint_interval = 100
